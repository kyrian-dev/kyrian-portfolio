    <script>
      try {
        const savedTheme = localStorage.getItem('kyrian-theme');
        if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.dataset.theme = savedTheme;
      } catch { /* Use the default theme when browser storage is unavailable. */ }
      document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === 'light' ? '#f8fafc' : '#080d16';
    </script>
